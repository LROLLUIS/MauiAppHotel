name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fixar SDK .NET 8
        run: |
          SDK=$(dotnet --list-sdks | grep '^8\.' | tail -1 | cut -d' ' -f1)
          echo "Usando SDK $SDK"
          dotnet new globaljson --sdk-version "$SDK" --roll-forward latestPatch --force
          dotnet --version

      - name: Instalar workload MAUI Android
        run: sudo dotnet workload install maui-android

      - name: Gerar APK
        run: >
          dotnet publish MauiAppHotel/MauiAppHotel.csproj
          -c Release
          -f net8.0-android
          -p:TargetFrameworks=net8.0-android
          -p:AndroidPackageFormat=apk
          -o saida

      - name: Renomear APK
        run: cp saida/*-Signed.apk MauiAppHotel.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MauiAppHotel-apk
          path: MauiAppHotel.apk

      - name: Publicar APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK MauiAppHotel (build ${{ github.run_number }})
          files: MauiAppHotel.apk
